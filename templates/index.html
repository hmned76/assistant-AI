<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AssistantAI – {{ nom_assistant }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#0f172a; height:100vh; display:flex; flex-direction:column; }
    header { background:#1e293b; color:#e2e8f0; padding:12px 16px; display:flex; align-items:center; gap:10px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
    header .avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#38bdf8,#818cf8); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
    header h1 { font-size:16px; }
    header span { font-size:12px; color:#94a3b8; }
    #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:78%; padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.45; word-wrap:break-word; }
    .user { align-self:flex-end; background:#2563eb; color:#fff; border-bottom-right-radius:4px; }
    .assistant { align-self:flex-start; background:#334155; color:#e2e8f0; border-bottom-left-radius:4px; }
    .msg .badge { display:inline-block; font-size:11px; background:rgba(255,255,255,.15); border-radius:8px; padding:1px 8px; margin-left:6px; }
    .info { text-align:center; color:#64748b; font-size:12px; margin:6px 0; }
    #barre { display:flex; gap:8px; padding:12px 16px; background:#1e293b; }
    #saisie { flex:1; padding:12px 14px; border:none; border-radius:24px; background:#0f172a; color:#e2e8f0; font-size:15px; outline:none; }
    #envoyer { border:none; border-radius:24px; background:#2563eb; color:#fff; padding:0 22px; font-weight:600; cursor:pointer; }
    #envoyer:hover { background:#1d4ed8; }
    .reload { font-size:12px; color:#94a3b8; text-align:center; padding:6px; background:#0f172a; }
  </style>
</head>
<body>
  <header>
    <div class="avatar">AI</div>
    <div>
      <h1>{{ nom_assistant }}</h1>
      <span>AssistantAI • mode : {{ mode }}</span>
    </div>
  </header>

  <div id="messages">
    <div class="info">AssistantAI est connecté. Parle normalement en Tunisien :)</div>
    {% for c in conversations %}
      <div class="msg {{ c.role }}">
        {{ c.contenu }}
        {% if c.intention %}<span class="badge">{{ c.intention }}</span>{% endif %}
      </div>
    {% endfor %}
  </div>

  <div id="barre">
    <input id="saisie" type="text" placeholder="Ex : prends rendez-vous avec mon frère Mohamed demain à 10h" autocomplete="off">
    <button id="envoyer">Envoyer</button>
  </div>
  <div class="reload">💾 Les conversations sont sauvegardées automatiquement dans la base locale.</div>

  <script>
    const saisie = document.getElementById('saisie');
    const envoyer = document.getElementById('envoyer');
    const messages = document.getElementById('messages');

    function ajouter(role, texte, badge) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = texte;
      if (badge) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = badge;
        div.appendChild(b);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function envoi() {
      const texte = saisie.value.trim();
      if (!texte) return;
      saisie.value = '';
      ajouter('user', texte);
      ajouter('assistant', '⌛ AssistantAI réfléchit…');
      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: texte })
        });
        const data = await resp.json();
        const dernier = messages.lastElementChild;
        if (dernier && dernier.textContent.includes('réfléchit')) dernier.remove();
        ajouter('assistant', data.reponse || 'Erreur de réponse.', data.intention);
      } catch (e) {
        const dernier = messages.lastElementChild;
        if (dernier) dernier.remove();
        ajouter('assistant', 'Impossible de joindre le serveur.');
      }
    }

    envoyer.addEventListener('click', envoi);
    saisie.addEventListener('keydown', e => { if (e.key === 'Enter') envoi(); });
    messages.scrollTop = messages.scrollHeight;
  </script>
</body>
</html>
